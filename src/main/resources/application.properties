spring.application.name=motogp

# Conexion BBDD
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:motogp}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:ahmfa!}

# Config JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

spring.jackson.mapper.allow-coercion-of-scalars=false

#Health check
management.endpoints.web.exposure.include=health

# Official league
official.league.id=1


# Spring Security
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=role
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

# JWT (emisión)
jwt.private-key-location=${JWT_PRIVATE_KEY:file:./private.pem}
jwt.issuer=motogp-api
jwt.expiration=1h


# LOGS
logging.level.org.springframework.security=INFO
