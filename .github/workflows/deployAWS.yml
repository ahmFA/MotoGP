name: Deploy to AWS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_motogp

          chmod 600 ~/.ssh/github_actions_motogp

          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      # set -e means: If any command in the script fails (returns a non-zero exit code), the entire script will immediately stop executing, and the job will be marked as failed.
      # This is useful for ensuring that if something goes wrong during the execution of the commands, you don't continue with subsequent steps that might depend on the success of earlier commands.
      - name: Deploy to AWS
        run: |
          ssh \
            -i ~/.ssh/github_actions_motogp \
            "${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }}" \
            'bash -se' <<'REMOTE'
             cd /home/ubuntu/dev/MotoGP && \
             set -e && \
             echo '=== Git pull ===' && \
             git fetch origin main && \
             git reset --hard origin/main && \
             echo '=== Docker build ===' && \
             docker compose build --quiet && \
             echo '=== Docker deploy ===' && \
             docker compose up -d && \
             echo '=== Containers ===' && \
             docker compose ps && \
             echo '=== Health check ===' && \
             for i in $(seq 1 12); do
                HEALTH="$(curl --fail https://api.grandprixpredictor.com/actuator/health || true)"
                echo "$HEALTH"
                if echo "$HEALTH" | grep -q '"status":"UP"'; then
                  echo "Health check OK"
                  exit 0
                fi
        
              echo "Waiting for application..."
              sleep 5
              done
              echo 'Health check failed'
              docker compose logs --tail=100
              exit 1
              REMOTE